server {
 listen 80;
 server_tokens off;

 root /usr/share/nginx/html/;
 index index.html index.htm;

 # Security headers. They stay at server level: an add_header inside a location would drop all of these for that location.
 add_header X-Content-Type-Options "nosniff" always;
 add_header X-Frame-Options "SAMEORIGIN" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
 # Enforced: no plugins, no <base> hijacking, no framing by other sites, forms only to this site.
 add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
 # Strict script policy in report-only mode first: the app loads Mol* (workers, blobs) and EBI/PDBe resources, so check the
 # browser console for violations before enforcing it.
 add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'none'" always;

 gzip on;
 gzip_comp_level 5;
 gzip_min_length 1024;
 gzip_types text/plain text/css application/javascript application/json image/svg+xml;

 # hashed build files never change: cache them for a year; the HTML entry point must always be revalidated
 location /static/ {
   include /etc/nginx/mime.types;
   expires 1y;
   try_files $uri =404;
 }

 location / {
   include /etc/nginx/mime.types;
   expires -1;
   try_files $uri /index.html =404;
 }
}
